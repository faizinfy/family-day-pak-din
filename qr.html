<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kod QR · Family Day Pak Din 2026</title>
<meta name="description" content="Poster kod QR untuk dicetak · Family Day Pak Din 2026">
<meta name="theme-color" content="#120c2b">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120c2b;
    --gold: #e8c476;
    --gold-2: #f6dfa4;
    --gold-deep: #b98a3e;
    --text: #f3ecdc;
    --muted: #b9b0cc;
    --ink: #2a1f55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Poppins", system-ui, sans-serif; font-weight: 300; color: var(--text);
    background: var(--night) radial-gradient(ellipse at 50% -10%, #3a2470 0%, transparent 55%) fixed;
    min-height: 100vh; line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; }
  .top { max-width: 820px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
  .top a { font-size: .85rem; color: var(--muted); text-decoration: none; }
  .top a:hover { color: var(--gold); }
  .print {
    padding: 9px 20px; border-radius: 999px; border: 0; font-weight: 600; color: var(--night);
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  }

  /* The poster: A4 portrait, prints on white */
  .poster {
    width: min(760px, calc(100% - 32px)); aspect-ratio: 210 / 297; margin: 18px auto 40px; padding: 6% 7%;
    background: #fffaf0; color: var(--ink); border-radius: 18px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45); border: 10px double var(--gold-deep);
  }
  .eyebrow { font-size: clamp(.7rem, 1.8vw, .95rem); letter-spacing: .35em; text-transform: uppercase; color: var(--gold-deep); font-weight: 500; }
  h1 { font-family: "Cinzel Decorative", serif; font-size: clamp(1.8rem, 6vw, 3.3rem); line-height: 1.1; color: var(--ink); margin-top: 6px; }
  .theme { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: clamp(1.1rem, 3vw, 1.6rem); color: #6b5a2e; }
  .codes { display: flex; justify-content: center; gap: 6%; width: 100%; }
  .code { flex: 1; max-width: 72%; display: flex; flex-direction: column; align-items: center; }
  .codes.two .code { max-width: 46%; }
  .code svg { width: 100%; height: auto; display: block; padding: 9%; /* quiet zone so phones read it easily */ background: #fff; border-radius: 14px; border: 2px solid var(--gold); }
  .code b { margin-top: 12px; font-size: clamp(.95rem, 2.6vw, 1.35rem); font-weight: 600; }
  .code small { font-size: clamp(.7rem, 1.8vw, .95rem); color: #6b6290; word-break: break-all; }
  .foot { font-size: clamp(.75rem, 2vw, 1rem); color: #6b6290; }
  .foot strong { color: var(--ink); font-weight: 600; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .top { display: none; }
    .poster { width: 210mm; height: 297mm; margin: 0; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<nav class="top">
  <a href="settings">← Tetapan</a>
  <button class="print" type="button" onclick="print()">🖨️ Cetak poster</button>
</nav>

<main class="poster">
  <div>
    <p class="eyebrow">Jemputan Keluarga</p>
    <h1>Family Day<br>Pak Din 2026</h1>
    <p class="theme">🐪 Arabian Nights · Kimi Chalet, Lekir ✨</p>
  </div>
  <div class="codes" id="codes"></div>
  <p class="foot"><strong>Imbas dengan kamera telefon</strong><br>Aturcara · permainan · senarai nama · keputusan</p>
</main>

<script src="assets/names.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/offline.js"></script>
<script>
  // QR as crisp SVG squares, so it prints sharp at any size
  function qrSvg(text) {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Kod QR ${text}"><path d="${d}" fill="#2a1f55"/></svg>`;
  }
  const short = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const codes = [{ url: FD.site, label: '🌙 Laman Family Day' }];
  if (FD.album.url) codes.push({ url: FD.album.url, label: '📸 Kongsi gambar anda' });
  const box = document.getElementById('codes');
  box.classList.toggle('two', codes.length > 1);
  box.innerHTML = codes.map(c => `<div class="code">${qrSvg(c.url)}<b>${c.label}</b><small>${short(c.url)}</small></div>`).join('');
</script>
</body>
</html>
