<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabutan Bertuah · Family Day Pak Din 2026</title>
<meta name="description" content="Lucky Draw, Tukar-Tukar Hadiah & Special Lucky Draw · Family Day Pak Din 2026">
<meta name="theme-color" content="#120c2b">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120c2b;
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(232, 196, 118, 0.22);
    --gold: #e8c476;
    --gold-2: #f6dfa4;
    --gold-deep: #b98a3e;
    --text: #f3ecdc;
    --muted: #b9b0cc;
    --accent: #d9677a;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Poppins", system-ui, sans-serif; font-weight: 300;
    color: var(--text); background: var(--night);
    background-image:
      radial-gradient(ellipse at 50% -10%, #3a2470 0%, transparent 55%),
      radial-gradient(ellipse at 100% 60%, rgba(185, 138, 62, 0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 0% 90%, rgba(217, 103, 122, 0.10) 0%, transparent 45%);
    background-attachment: fixed;
    line-height: 1.6; min-height: 100svh; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .6; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 16px 56px; }

  /* Top bar */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 0; }
  .top a, .top button {
    font-size: .82rem; color: var(--muted); text-decoration: none; background: none; border: 0;
    padding: 6px 2px;
  }
  .top a:hover, .top button:hover { color: var(--gold); }
  .top span { display: flex; gap: 14px; }

  header { text-align: center; padding: 22px 0 8px; }
  .eyebrow { font-size: .72rem; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); }
  h1 {
    font-family: "Cinzel Decorative", serif; font-size: clamp(1.9rem, 8vw, 3rem); line-height: 1.15; margin-top: 6px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }

  /* Main tabs */
  .mtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
  .mtab {
    padding: 12px 6px; border-radius: 16px; text-align: center;
    background: var(--card); border: 1px solid var(--card-border); transition: .25s;
  }
  .mtab .i { display: block; font-size: 1.4rem; line-height: 1.2; }
  .mtab b { display: block; font-weight: 500; font-size: .84rem; line-height: 1.3; margin-top: 2px; }
  .mtab[aria-selected="true"] { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: var(--night); border-color: transparent; }

  /* Sub tabs */
  .stabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .stab {
    padding: 8px 14px; border-radius: 999px; font-size: .85rem; font-weight: 500;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .12); transition: .25s;
  }
  .stab[aria-selected="true"] { background: rgba(232, 196, 118, .18); border-color: var(--gold); color: var(--gold-2); }
  .stabs:empty { display: none; }

  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 22px 20px; backdrop-filter: blur(6px);
    margin-top: 16px;
  }

  /* Stage */
  .stage { text-align: center; padding: 28px 20px 24px; }
  .pool-label { font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .pool-note { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .screen {
    position: relative; margin: 18px auto 0; min-height: 132px; max-width: 520px;
    display: grid; place-items: center; padding: 18px; border-radius: 18px;
    background: rgba(0, 0, 0, .25); border: 1px solid var(--card-border);
    overflow: hidden;
  }
  .screen::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, rgba(232, 196, 118, .18), transparent 60%);
  }
  .name {
    position: relative; font-family: "Cormorant Garamond", serif; font-weight: 600;
    font-size: clamp(2rem, 9vw, 3.4rem); line-height: 1.1; color: var(--gold-2);
    word-break: break-word;
  }
  .name.idle { font-size: 1.3rem; font-style: italic; color: var(--muted); font-weight: 500; }
  .name.rolling { color: var(--text); opacity: .85; }
  .name.win { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); text-shadow: 0 0 30px rgba(232, 196, 118, .55); }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .badge { position: relative; display: block; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }

  .draw {
    margin-top: 20px; padding: 14px 40px; border: 0; border-radius: 999px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: var(--night);
    font-weight: 600; font-size: 1.1rem; letter-spacing: .04em;
    box-shadow: 0 8px 30px rgba(232, 196, 118, .25); transition: transform .15s, opacity .2s;
  }
  .draw:hover:not(:disabled) { transform: translateY(-2px); }
  .draw:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
  .actions .draw { margin-top: 0; }
  .music-btn {
    padding: 12px 22px; border-radius: 999px; font-size: .95rem; font-weight: 500;
    background: rgba(255, 255, 255, .06); border: 1px solid var(--card-border); transition: .2s;
  }
  .music-btn:hover { border-color: var(--gold); color: var(--gold-2); }
  .music-btn.on { border-color: var(--gold); color: var(--gold-2); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(232, 196, 118, .12); } }
  .count { margin-top: 12px; font-size: .85rem; color: var(--muted); }
  .count b { color: var(--gold-2); font-weight: 500; }
  .vhint { margin-top: 6px; font-size: .76rem; color: var(--muted); }
  .vhint select, .vhint button {
    margin-left: 4px; padding: 4px 10px; border-radius: 999px; font-size: .78rem;
    background: rgba(0, 0, 0, .3); color: var(--text); border: 1px solid var(--card-border);
  }
  .vhint select option { background: var(--night); }
  .vhint button:hover { border-color: var(--gold); color: var(--gold-2); }
  .vhint.warn { color: var(--accent); max-width: 420px; margin-left: auto; margin-right: auto; }

  /* Winners + pool */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-title { font-weight: 600; color: var(--gold-2); font-size: 1rem; }
  .link-btn { background: none; border: 0; font-size: .8rem; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .link-btn:hover { color: var(--accent); }
  .winners { list-style: none; margin-top: 12px; display: grid; gap: 8px; counter-reset: w; }
  .winners li {
    counter-increment: w; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px; background: rgba(232, 196, 118, .08);
  }
  .winners li::before {
    content: attr(data-n); flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; font-size: .8rem; font-weight: 600;
    border: 1px solid var(--gold); color: var(--gold);
  }
  .winners li span { flex: 1; font-weight: 500; }
  .winners li button { background: none; border: 0; color: var(--muted); font-size: .8rem; padding: 2px 6px; }
  .winners li button:hover { color: var(--accent); }
  .winners li button.gift { font-size: 1.05rem; opacity: .85; }
  .winners li button.gift:hover { opacity: 1; transform: scale(1.15); }

  /* Prize bar under the name screen (family Lucky Draw) */
  .prize-bar {
    display: flex; align-items: center; gap: 14px; width: 100%; margin: 14px auto 0; padding: 10px 14px;
    border-radius: 16px; text-align: left; background: rgba(232, 196, 118, .08); border: 1px solid var(--card-border);
    transition: border-color .2s, background .2s;
  }
  .prize-bar[hidden] { display: none; } /* family Lucky Draw only */
  .prize-bar:hover { border-color: var(--gold); background: rgba(232, 196, 118, .14); }
  .prize-bar .thumb {
    width: 64px; height: 64px; flex: none; border-radius: 12px; background: #fff center / contain no-repeat;
    display: grid; place-items: center; font-size: 1.8rem;
  }
  .prize-bar .pt { flex: 1; min-width: 0; }
  .prize-bar small { display: block; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .prize-bar b { display: block; font-weight: 500; font-size: 1.05rem; line-height: 1.3; }
  .prize-bar .view { flex: none; font-size: .85rem; color: var(--gold-2); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--gold); }

  /* Prize overlay */
  .pv {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 3vh 3vw;
    background: rgba(5, 3, 15, .78); backdrop-filter: blur(6px); animation: pvFade .25s ease;
  }
  .pv[hidden] { display: none; }
  @keyframes pvFade { from { opacity: 0; } }
  .pv-card {
    position: relative; width: min(900px, 100%); max-height: 94vh; display: flex; flex-direction: column; align-items: center;
    padding: 28px 32px 22px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, #24195a, #160f38); border: 1px solid var(--gold);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 60px rgba(232, 196, 118, .15);
    animation: pvPop .35s cubic-bezier(.2, 1.3, .4, 1);
  }
  @keyframes pvPop { from { transform: scale(.85); opacity: 0; } }
  .pv-x { position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--card-border); background: rgba(0, 0, 0, .3); font-size: 1.1rem; }
  .pv-x:hover { border-color: var(--gold); color: var(--gold-2); }
  .pv-no {
    display: inline-block; padding: 6px 18px; border-radius: 999px; font-weight: 600; letter-spacing: .06em;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: var(--night);
  }
  .pv-img {
    margin-top: 18px; width: 100%; height: min(58vh, 560px); border-radius: 18px; background: #fff;
    display: grid; place-items: center; overflow: hidden;
  }
  .pv-img img { width: 100%; height: 100%; min-height: 0; object-fit: contain; padding: 3%; }
  .pv-img .none { font-size: 7rem; }
  .pv-name { margin-top: 16px; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: clamp(1.5rem, 3.4vh, 2.3rem); line-height: 1.2; color: var(--gold-2); }
  .pv-who { margin-top: 4px; color: var(--muted); font-size: 1rem; }
  .pv-who:empty { display: none; }
  .pv-nav { display: flex; align-items: center; gap: 18px; margin-top: 14px; color: var(--muted); font-size: .85rem; }
  .pv-nav button { width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; line-height: 1; border: 1px solid var(--card-border); background: rgba(0, 0, 0, .3); }
  .pv-nav button:hover { border-color: var(--gold); color: var(--gold-2); }
  .empty { margin-top: 10px; font-size: .88rem; color: var(--muted); }

  .pool { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pool span {
    padding: 5px 12px; border-radius: 999px; font-size: .84rem;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); transition: .3s;
  }
  .pool span.out { opacity: .3; text-decoration: line-through; }
  .pool span.away { border-color: var(--accent); }
  .away-btn:hover { border-color: var(--accent); color: var(--accent); }
  .away-btn:disabled { opacity: .45; cursor: not-allowed; }
  .absent { margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(217, 103, 122, .35); display: flex; flex-wrap: wrap; gap: 6px; }
  .absent p { width: 100%; font-size: .8rem; color: var(--accent); }
  .absent button { padding: 4px 12px; border-radius: 999px; font-size: .84rem; background: rgba(217, 103, 122, .1); border: 1px solid rgba(217, 103, 122, .35); }
  .absent button:hover { border-color: var(--gold); color: var(--gold-2); }
  .pool span.hot { background: rgba(232, 196, 118, .3); border-color: var(--gold); }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .confetti i {
    position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--r)); } }

  /* Desktop layout: draw on the left, Pemenang on the right */
  .wrap { max-width: 1280px; padding: 0 32px 48px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; margin-top: 8px; }
  .main > .mtabs { margin-top: 14px; }
  .side {
    position: sticky; top: 16px; margin-top: 14px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  }
  .side .winners { overflow-y: auto; padding-right: 4px; }
  .side-sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .side .winners li { font-size: 1.05rem; }
  .side .winners li:last-child { background: rgba(232, 196, 118, .2); outline: 1px solid var(--gold); }
  .screen { max-width: none; min-height: 200px; }
  .name { font-size: clamp(2.6rem, 5vw, 4.4rem); }

  /* Projector mode */
  body.big .wrap { max-width: none; }
  body.big .name { font-size: clamp(3.4rem, 7vw, 6.5rem); }
  body.big .screen { min-height: 280px; }
  body.big .layout { grid-template-columns: minmax(0, 1fr) 440px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
    .confetti { display: none; }
  }
</style>
</head>

<div class="wrap">

</div>

<div class="confetti" id="confetti"></div>

<!-- Prize image overlay -->
<div class="pv" id="pv" hidden role="dialog" aria-modal="true" aria-labelledby="pvName">

<script>
  FDK.stars(70);
  const { voice } = FDK;

  // Sound — synthesized with Web Audio, no files (on/off, notes & voice shared in assets/common.js)
  const sound = {
    get on() { return FDK.sound.on; },
    ctx: () => FDK.sound.ctx(),
    toggle: () => FDK.sound.toggle(),
    unlock: () => FDK.sound.unlock(),
    // short blip per name while rolling; pitch rises as it slows
    tick(p) { FDK.sound.note(520 + p * 380, 0, 0.06, 'square', 0.05); },
    win: () => FDK.sound.fanfare(),
    undo() { FDK.sound.note(392, 0, 0.12, 'sine', 0.1); FDK.sound.note(293.66, 0.1, 0.2, 'sine', 0.1); },

    say: (text, delay) => voice.say(text, delay),

    { id: 'zapin', name: 'Zapin Kenduri', bpm: 118,
      drums: { rebana: [0, 6, 8], tek: [4, 10, 12, 14], hat: [0, 2, 4, 6, 8, 10, 12, 14] },
      lead: 'pluck', leadVol: 0.22,
      melody: [
        [0, 'A4', 2], [2, 'B4', 2], [4, 'C5', 2], [6, 'D5', 2], [8, 'E5', 3], [11, 'D5', 1], [12, 'C5', 2], [14, 'B4', 2],
        [16, 'C5', 2], [18, 'B4', 2], [20, 'A4', 2], [22, 'G#4', 2], [24, 'A4', 6], [30, 'E4', 2],
        [32, 'F5', 2], [34, 'E5', 2], [36, 'D5', 2], [38, 'E5', 2], [40, 'C5', 2], [42, 'D5', 2], [44, 'B4', 4],
        [48, 'C5', 2], [50, 'B4', 2], [52, 'A4', 2], [54, 'G#4', 2], [56, 'A4', 8]],
      bass: [[0, 'A2', 4], [8, 'E2', 4], [16, 'A2', 4], [24, 'A2', 4], [32, 'D2', 4], [40, 'A2', 4], [48, 'E2', 4], [56, 'A2', 4]] },

    { id: 'habibi', name: 'Ya Habibi Party', bpm: 128,
      drums: { doum: [0, 6, 8], tek: [2, 4, 10, 12, 14], clap: [4, 12] },
      lead: 'reed', leadVol: 0.1,

        [16, 'F5', 2], [18, 'A5', 2], [20, 'C6', 2], [22, 'A5', 2], [24, 'F5', 4], [28, 'G5', 4],
        [32, 'G5', 2], [34, 'B5', 2], [36, 'D6', 2], [38, 'B5', 2], [40, 'G5', 4], [44, 'F5', 2], [46, 'D5', 2],
        [48, 'E5', 2], [50, 'G5', 2], [52, 'C6', 4], [56, 'G5', 2], [58, 'E5', 2], [60, 'C5', 4]],
      bass: [0, 4, 8, 12].flatMap(s => [[s, 'C2', 2], [s + 2, 'C3', 2]])
        .concat([16, 20, 24, 28].flatMap(s => [[s, 'F2', 2], [s + 2, 'F3', 2]]))
        .concat([32, 36, 40, 44].flatMap(s => [[s, 'G2', 2], [s + 2, 'G3', 2]]))
        .concat([48, 52, 56, 60].flatMap(s => [[s, 'C2', 2], [s + 2, 'C3', 2]])) }
  ];

  // MP3 songs from assets/music/music.js join the list after the built-in tunes
  (window.FD_MUSIC || []).forEach(m => TUNES.push({ id: 'mp3:' + m.id, name: '🎧 ' + m.name, mp3: m }));

  const MUSIC_KEY = 'fd-lucky-draw-music';
  const music = (function () {
    let tune = TUNES[0], audio = null;
    try { tune = TUNES.find(t => t.id === localStorage.getItem(MUSIC_KEY)) || TUNES[0]; } catch (e) {}
    let bus = null, timer = null, nextT = 0, step = 0, noiseBuf = null, onChange = () => {};

    const freq = n => {
      const m = /^([A-G])(#|b)?(\d)$/.exec(n);
      const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
      return 440 * Math.pow(2, ((+m[3] + 1) * 12 + semi - 69) / 12);
    };
    function noise(c) {
      if (!noiseBuf) {
        noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const s = c.createBufferSource(); s.buffer = noiseBuf; return s;
    }
    function env(c, t, vol, dur, attack = 0.01) {
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(bus);
      return g;
    }
    function osc(c, type, f) { const o = c.createOscillator(); o.type = type; o.frequency.value = f; return o; }
    function filt(c, type, f, q = 1) { const x = c.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
    function burst(c, t, vol, dur, type, f, q) {
      const s = noise(c);
      s.connect(filt(c, type, f, q)).connect(env(c, t, vol, dur, 0.002));
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function sweep(c, t, vol, from, to, dur) {
      const o = osc(c, 'sine', from);
      o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.8);
      o.connect(env(c, t, vol, dur, 0.004)); o.start(t); o.stop(t + dur + 0.02);
    }

    const DRUMS = {
      doum:   (c, t, v) => sweep(c, t, 0.55 * v, 130, 55, 0.3),
      kick:   (c, t, v) => sweep(c, t, 0.7 * v, 150, 45, 0.22),
      rebana: (c, t, v) => { sweep(c, t, 0.45 * v, 240, 140, 0.16); burst(c, t, 0.08 * v, 0.04, 'bandpass', 1800, 1); },
      tek:    (c, t, v) => burst(c, t, 0.15 * v, 0.06, 'highpass', 3200, 1),
      hat:    (c, t, v) => burst(c, t, 0.06 * v, 0.03, 'highpass', 7000, 1),
      clap:   (c, t, v) => [0, 0.012, 0.024].forEach(d => burst(c, t + d, 0.22 * v, 0.08, 'bandpass', 1500, 1))
    };
    const INSTR = {
      // triangle + vibrato
      flute(c, t, f, dur, vol) {
        const o = osc(c, 'triangle', f), v = osc(c, 'sine', 5.5), vg = c.createGain();
        vg.gain.value = f * 0.006; v.connect(vg).connect(o.frequency);
        o.connect(env(c, t, vol, dur * 0.95)); o.start(t); v.start(t); o.stop(t + dur); v.stop(t + dur);
      },
      // gambus / oud: bright attack that darkens quickly
      pluck(c, t, f, dur, vol) {
        const o = osc(c, 'sawtooth', f), lp = filt(c, 'lowpass', 3200, 2);
        lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.25);
        o.connect(lp).connect(env(c, t, vol, Math.min(dur, 0.5) + 0.25, 0.004)); o.start(t); o.stop(t + dur + 0.3);
      },
      // mizmar-ish reed
      reed(c, t, f, dur, vol) {
        const o = osc(c, 'sawtooth', f), v = osc(c, 'sine', 6), vg = c.createGain();
        vg.gain.value = f * 0.008; v.connect(vg).connect(o.frequency);
        o.connect(filt(c, 'bandpass', 1400, 0.7)).connect(env(c, t, vol, dur * 0.95, 0.02));
        o.start(t); v.start(t); o.stop(t + dur); v.stop(t + dur);
      },
      square(c, t, f, dur, vol) {
        const o = osc(c, 'square', f);
        o.connect(env(c, t, vol, dur * 0.9, 0.005)); o.start(t); o.stop(t + dur);
      },
      bass(c, t, f, dur, vol) {
        const o = osc(c, 'triangle', f);
        o.connect(env(c, t, vol, dur * 0.95, 0.005)); o.start(t); o.stop(t + dur);
      },
      drone(c, t, f, dur, vol) {
        const o = osc(c, 'sawtooth', f), g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(filt(c, 'lowpass', 500)).connect(g).connect(bus); o.start(t); o.stop(t + dur + 0.05);
      }
    };

    function schedule() {
      const c = sound.ctx(); if (!c || !bus) return;
      const STEP = 60 / tune.bpm / 4, dv = tune.drumVol || 1;
      while (nextT < c.currentTime + 0.25) {
        const s16 = step % 16, s64 = step % 64;
        for (const k in tune.drums) if (tune.drums[k].includes(s16)) DRUMS[k](c, nextT, dv);
        if (tune.drone && s16 === 0) INSTR.drone(c, nextT, freq(tune.drone), STEP * 16, 0.06);
        tune.melody.forEach(m => { if (m[0] === s64) INSTR[tune.lead](c, nextT, freq(m[1]), m[2] * STEP, tune.leadVol); });
        (tune.bass || []).forEach(m => { if (m[0] === s64) INSTR.bass(c, nextT, freq(m[1]), m[2] * STEP, 0.22); });
        nextT += STEP; step++;
      }
    }

    // MP3: play from start, loop back at end or when the song finishes
    function fade(a, to, ms, done) {
      const from = a.volume, t0 = performance.now();
      const id = setInterval(() => {
        const k = Math.min((performance.now() - t0) / ms, 1);
        a.volume = from + (to - from) * k;
        if (k === 1) { clearInterval(id); if (done) done(); }
      }, 30);
    }
    function startMp3() {
      const m = tune.mp3, from = m.start || 0;
      const a = audio = new Audio('assets/music/' + encodeURIComponent(m.file));
      a.volume = 0;
      a.addEventListener('loadedmetadata', () => { a.currentTime = from; }, { once: true });
      a.addEventListener('timeupdate', () => { if (m.end && a.currentTime >= m.end) a.currentTime = from; });
      a.addEventListener('ended', () => { a.currentTime = from; a.play().catch(() => {}); });
      a.addEventListener('error', () => {
        console.warn('Muzik tidak dijumpai: assets/music/' + m.file);
        if (audio === a) { audio = null; onChange(); }
      });
      a.play().then(() => fade(a, m.volume ?? 0.8, 600)).catch(() => {});
      onChange();
    }

    return {
      tunes: TUNES,
      get tune() { return tune; },
      get playing() { return !!timer || !!audio; },
      set onChange(fn) { onChange = fn; },
      setTune(id) {
        tune = TUNES.find(t => t.id === id) || TUNES[0];
        try { localStorage.setItem(MUSIC_KEY, tune.id); } catch (e) {}
        if (this.playing) { this.stop(); this.start(); }
      },
      start() {
        if (tune.mp3) { if (sound.on && !audio && !timer) startMp3(); return; }
        const c = sound.on && sound.ctx(); if (!c || timer || audio) return;
        bus = c.createGain();
        bus.gain.setValueAtTime(0.0001, c.currentTime);
        bus.gain.exponentialRampToValueAtTime(0.7, c.currentTime + 0.6);
        bus.connect(c.destination);
        nextT = c.currentTime + 0.05; step = 0;
        schedule(); timer = setInterval(schedule, 60);
        onChange();
      },
      stop() {
        if (audio) {
          const a = audio; audio = null;
          fade(a, 0, 400, () => a.pause());
          onChange();
          return;
        }
        if (!timer) return;
        clearInterval(timer); timer = null;
        const c = sound.ctx(), old = bus; bus = null;
        if (c && old) {
          old.gain.cancelScheduledValues(c.currentTime);
          old.gain.setValueAtTime(old.gain.value, c.currentTime);
          old.gain.linearRampToValueAtTime(0, c.currentTime + 0.4);
          setTimeout(() => old.disconnect(), 600);
        }
        onChange();
      }
    };
  })();

  // Draws & pools
  const DRAWS = [
    { id: 'lucky', i: '🎟️', name: 'Lucky Draw', win: '🏆 Pemenang', pools: [
      { id: 'lucky', name: '10 Keluarga', names: FD.families.map(n => 'Keluarga ' + n) } ] },
    { id: 'gift', i: '🎁', name: 'Tukar Hadiah', win: '🎁 Urutan Cabutan', pools: [
      { id: 'gift-dewasa', name: 'Dewasa', note: 'Lebih 30 tahun', names: FD.gift.dewasa },
      { id: 'gift-muda', name: 'Muda-Mudi', note: '13 – 30 tahun', names: FD.gift.muda },
      { id: 'gift-kanak', name: 'Kanak-kanak', note: '12 tahun ke bawah', names: FD.gift.kanak } ] },
    { id: 'special', i: '✨', name: 'Special Lucky Draw', win: '🏆 Pemenang', pools: [
      { id: 'sp-all', name: 'Semua Peserta', note: 'Semua peserta layak · Dewasa, Muda-Mudi & Kanak-kanak',
        names: FD.gift.dewasa.concat(FD.gift.muda, FD.gift.kanak) } ] }
  ];

  const KEY = 'fd-lucky-draw-v1';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let draw = DRAWS[0], pool = draw.pools[0], rolling = false;
  const $ = id => document.getElementById(id);
  const won = () => (state[pool.id] = state[pool.id] || []);
  // winners who weren't there: recorded, and left out of the next draws
  const absent = () => (state['absent:' + pool.id] = state['absent:' + pool.id] || []);
  const left = () => pool.names.filter(n => !won().includes(n) && !absent().includes(n));
  let lastWin = null; // { pool, name } of the draw just shown — the one "Tiada di sini" applies to
  // Lucky Draw prizes count down: 1st family drawn wins hadiah #10, last wins #1
  const prizeNo = i => draw.id === 'lucky' ? pool.names.length - i : 0;
  const malayNum = n => ['kosong', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'lapan', 'sembilan', 'sepuluh'][n] || String(n);
  const rand = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };

  function tabs(box, items, current, cls, onPick, label) {
    box.innerHTML = '';
    if (items.length < 2) return;
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = cls; b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', it === current);
      b.innerHTML = label(it);
      b.onclick = () => { if (!rolling) onPick(it); };
      box.appendChild(b);
    });
  }

  function render() {
    tabs($('mtabs'), DRAWS, draw, 'mtab', d => { draw = d; pool = d.pools[0]; idle(); render(); },
      d => `<span class="i">${d.i}</span><b>${d.name}</b>`);
    tabs($('stabs'), draw.pools, pool, 'stab', p => { pool = p; idle(); render(); }, p => p.name);

    $('poolLabel').textContent = draw.name + (draw.pools.length > 1 ? ' · ' + pool.name : '');
    $('poolNote').textContent = pool.note || '';
    const w = won(), l = left(), a = absent();
    $('count').innerHTML = `Baki <b>${l.length}</b> / ${pool.names.length} · Dicabut <b>${w.length}</b>` +
      (a.length ? ` · Tiada <b>${a.length}</b>` : '');
    $('draw').disabled = rolling || !l.length;
    $('draw').textContent = l.length ? '🎲 Cabut!' : '✅ Semua telah dicabut';

    $('redraw').disabled = !l.length;

    $('winSub').textContent = $('poolLabel').textContent;

      const p = prizeNo(i);

      return `<li data-n="${p || i + 1}"><span>${n}</span>${gift}<button type="button" data-i="${i}" title="Batal cabutan ini">✕</button></li>`;
    }).join('');
    renderPrizeBar();
    $('empty').hidden = w.length > 0;
    $('reset').hidden = !w.length && !a.length;
    $('absent').hidden = !a.length;
    $('absent').innerHTML = `<p>🚫 Tiada di sini</p>` +

    $('poolCount').textContent = `(${pool.names.length})`;
    $('pool').innerHTML = pool.names.map(n =>
      `<span class="${w.includes(n) ? 'out' : a.includes(n) ? 'out away' : ''}">${n}</span>`).join('');
  }

  // Prize bar: follows Baki — the prize number always equals the families left to draw
  // (during a draw that's the prize being drawn; afterwards it moves on to the next one)
  const prizeInfo = n => FD.prizes[n - 1] || { name: 'Hadiah #' + n, img: '' };
  const winnerOf = n => { const i = pool.names.length - n; return draw.id === 'lucky' ? won()[i] || '' : ''; };
  function renderPrizeBar() {
    const bar = $('prizeBar');
    const n = draw.id === 'lucky' ? left().length : 0;
    bar.hidden = !n;
    if (!n) return;
    const p = prizeInfo(n);
    const label = rolling ? `Sedang dicabut · Hadiah #${n}` : `Hadiah seterusnya · #${n}`;
    bar.dataset.p = n;
    bar.innerHTML = `<span class="thumb" ${p.img ? `style="background-image:url('${p.img}')"` : ''}>${p.img ? '' : '🎁'}</span>
      <span class="pt"><small>${label}</small><b>${p.name}</b></span><span class="view">🖼️ Lihat hadiah</span>`;
  }

  // Prize overlay
  let pvAt = 0;
  function openPrize(n) {
    pvAt = n;
    const p = prizeInfo(n), who = draw.id === 'lucky' ? winnerOf(n) : '';
    $('pvNo').textContent = `🎁 Hadiah #${n}`;
    $('pvImg').innerHTML = p.img ? `<img src="${p.img}" alt="${p.name.replace(/"/g, '&quot;')}">` : '<span class="none">🎁</span>';
    $('pvName').textContent = p.name;
    $('pvWho').textContent = who ? '🏆 ' + who : '';
    $('pvPos').textContent = `${n} / ${FD.prizes.length}`;
    $('pv').hidden = false;
  }
  const closePrize = () => { $('pv').hidden = true; };
  const stepPrize = d => openPrize((pvAt - 1 + d + FD.prizes.length) % FD.prizes.length + 1);
  $('prizeBar').onclick = () => openPrize(+$('prizeBar').dataset.p);
  $('pvClose').onclick = closePrize;
  $('pvPrev').onclick = () => stepPrize(-1);
  $('pvNext').onclick = () => stepPrize(1);
  $('pv').onclick = e => { if (e.target === $('pv')) closePrize(); };
  document.addEventListener('keydown', e => {
    if ($('pv').hidden) return;
    if (e.key === 'Escape') closePrize();
    else if (e.key === 'ArrowLeft') stepPrize(-1);
    else if (e.key === 'ArrowRight') stepPrize(1);
    else if (!(e.code === 'Space' && e.target === document.body)) return; // no drawing behind the overlay
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);

  function idle() {
    lastWin = null;
    const el = $('name');
    el.className = 'name idle';
    el.textContent = 'Tekan “Cabut!” untuk mula';
  }

  function roll() {
    const l = left();
    if (rolling || !l.length) return;
    music.stop();
    rolling = true; render();
    sound.unlock();
    const el = $('name'), chips = [...$('pool').children];
    const winner = l[rand(l.length)];
    const prize = prizeNo(won().length);
    let t = 0, delay = 50;
    const total = l.length === 1 ? 600 : 3200;

    // Lucky Draw & Special: announce the prize first, then spin once the voice is done
    const intro = prize ? { badge: `🎁 Hadiah #${prize} 🎁`, say: `Pemenang hadiah nombor ${malayNum(prize)}` }
      : draw.id === 'special' ? { badge: '✨ Hadiah Istimewa ✨', say: 'Pemenang hadiah istimewa' } : null;
    if (intro) {
      el.className = 'name win';
      el.innerHTML = `<span class="badge">${intro.badge}</span>Siapakah pemenangnya?`;
      sound.say(intro.say).then(() => setTimeout(tick, 250));
    } else {
      sound.unlockSpeech();
      tick();
    }

    function tick() {
      const n = l.length === 1 ? winner : l[rand(l.length)];
      el.className = 'name rolling';
      el.textContent = n;
      chips.forEach(c => c.classList.toggle('hot', c.textContent === n));
      sound.tick(Math.min(t / total, 1));
      t += delay;
      if (t < total) { delay = Math.min(delay * 1.07, 320); setTimeout(tick, delay); }
      else {
        chips.forEach(c => c.classList.remove('hot'));
        won().push(winner); save();
        const n = won().length;
        lastWin = { pool: pool.id, name: winner };
        rolling = false;
        render();
        el.className = 'name win';
        const badge = prize ? 'Hadiah #' + prize : draw.id === 'gift' ? 'Giliran #' + n : 'Tahniah!';
        el.innerHTML = `<span class="badge">🎉 ${badge} 🎉</span>${winner}`;
        confetti();
        sound.win();
        const spoken = voice.spoken(winner);
        sound.say('Tahniah kepada ' + spoken, 1300).then(() => {
          // family Lucky Draw: celebrate until the next Cabut (unless a new draw already started)
          if (prize && !rolling && sound.on) { musicReady = true; music.start(); }
        });
      }
    }
  }

  const confetti = () => FDK.confetti(90);

  $('draw').onclick = roll;
  // Winner not here: record them as absent and draw again for the same prize
  $('redraw').onclick = () => {
    if (rolling || !lastWin) return;
    const n = lastWin.name;
    if (!confirm(`“${n}” tiada di sini?\nNama ini akan direkod sebagai tiada, dan cabutan semula dibuat untuk hadiah yang sama.`)) return;
    const w = won();
    if (w[w.length - 1] === n) w.pop();
    absent().push(n); save();
    lastWin = null;
    if (window.speechSynthesis) speechSynthesis.cancel();
    roll();
  };
  $('absent').onclick = e => {
    const i = e.target.dataset.a;
    if (i == null || rolling) return;
    const n = absent()[i];
    if (!confirm(`Masukkan semula “${n}” ke dalam cabutan?`)) return;
    absent().splice(i, 1); save(); render();
  };
  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && e.target === document.body) { e.preventDefault(); roll(); }
  });
  $('winners').onclick = e => {
    if (e.target.dataset.p) return openPrize(+e.target.dataset.p);
    const i = e.target.dataset.i;
    if (i == null || rolling) return;
    const n = won()[i];
    if (!confirm(`Batalkan cabutan “${n}”? Nama ini akan dimasukkan semula.`)) return;
    won().splice(i, 1); save(); render(); sound.undo();
  };
  function sndLabel() {
    $('snd').textContent = sound.on ? '🔊 Bunyi' : '🔇 Senyap';
    $('snd').setAttribute('aria-pressed', sound.on);
  }
  $('snd').onclick = () => {
    if (!sound.toggle()) { music.stop(); if (window.speechSynthesis) speechSynthesis.cancel(); }
    sndLabel();
  };

  // Music button: appears once the first family winner's music starts; pauses / resumes it
  let musicReady = false;
  music.onChange = () => {
    const b = $('musicBtn');
    b.hidden = !musicReady;
    b.textContent = music.playing ? '⏸ Henti Muzik' : '▶ Main Muzik';
    b.classList.toggle('on', music.playing);
  };
  $('tune').innerHTML = music.tunes.map(t =>
    `<option value="${t.id}"${t === music.tune ? ' selected' : ''}>${t.name}</option>`).join('');
  $('tune').onchange = e => music.setTune(e.target.value);
  $('musicBtn').onclick = () => {
    if (music.playing) return music.stop();
    if (!sound.on) { sound.toggle(); sndLabel(); }
    music.start();
  };
  // Voices load asynchronously; offer a dropdown of Malay/Indonesian voices, or a hint if there's none
  function voiceHint() {
    const el = $('vhint');
    if (!window.speechSynthesis) { el.textContent = '🗣️ Pelayar ini tidak boleh membaca nama.'; el.hidden = false; return; }
    const list = voice.list(), cur = voice.pick();
    el.hidden = false;
    el.classList.toggle('warn', !list.length);
    if (!list.length) {
      el.textContent = '🗣️ Tiada suara Bahasa Melayu dalam pelayar ini — buka laman ini di Microsoft Edge atau Google Chrome untuk sebutan Melayu.';
      return;
    }
    el.innerHTML = '<label for="voice">🗣️ Suara</label> <select id="voice"></select>';
    $('voice').innerHTML = list.map(v =>
      `<option value="${v.name.replace(/"/g, '&quot;')}"${v === cur ? ' selected' : ''}>${voice.label(v)}</option>`).join('');
    $('voice').onchange = e => voice.choose(e.target.value);
  }
  if (window.speechSynthesis) speechSynthesis.addEventListener?.('voiceschanged', voiceHint);
  setTimeout(voiceHint, 600);
  sndLabel();
  $('reset').onclick = () => {
    if (rolling) return;
    if (!confirm(`Reset semua cabutan untuk ${$('poolLabel').textContent}?`)) return;
    state[pool.id] = []; state['absent:' + pool.id] = []; save(); idle(); render();
  };
  $('fs').onclick = () => {
    document.body.classList.toggle('big');
    const on = document.body.classList.contains('big');
    try { on ? document.documentElement.requestFullscreen?.() : document.exitFullscreen?.(); } catch (e) {}
  };
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('big');
  });

  // results restored / cleared from the Tetapan page in another tab
  addEventListener('storage', e => {
    if (e.key !== KEY && e.key !== null) return;
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (err) { state = {}; }
    if (!rolling) { idle(); render(); }
  });

  render();
</script>
</body>
</html>
